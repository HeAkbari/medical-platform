# Production stack for VPS — Medical Platform + HAPI FHIR
#
# Ports chosen to avoid common conflicts (8080, 3000, 3001):
#   - Web app:      3002  →  http://YOUR_IP:3002
#   - HAPI FHIR UI: 8082  →  http://YOUR_IP:8082
#   - PostgreSQL:   internal only (no host port)
#
# Usage (from repo root on the server):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.prod.yml logs -f
#   docker compose -f deploy/docker-compose.prod.yml down        # keeps data
#   docker compose -f deploy/docker-compose.prod.yml down -v     # wipes all DBs — irreversible
#
# HAPI FHIR (+ its postgres) only start with the `fhir` profile:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env --profile fhir up -d

name: medical-platform

services:
  # HAPI FHIR sandbox + its database are opt-in (`--profile fhir`), not
  # started by default: production reads OSCAR (DATA_SOURCE=oscar), and on
  # this VPS (3.8 GB RAM, shared with OSCAR's Tomcat) HAPI's JVM was enough to
  # get OSCAR OOM-killed during a web build — see VPS-DEPLOY.md §12.
  postgres:
    image: postgres:16
    container_name: medical-platform-postgres
    profiles: ["fhir"]
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:-hapi}
    volumes:
      - medical-platform-hapi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - medical-platform

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: medical-platform-hapi-fhir
    profiles: ["fhir"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HAPI_HOST_PORT:-8082}:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: ${HAPI_DB_PASSWORD:-hapi}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      # Limit JVM heap on small VPS (avoid OOM during first boot)
      JAVA_TOOL_OPTIONS: ${HAPI_JAVA_OPTS:--Xms256m -Xmx768m}
    healthcheck:
      # hapiproject/hapi is distroless — no curl/wget; use built-in Java HealthCheck
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    networks:
      - medical-platform

  # Platform database (ClinicCredential, Facility, Doctor, Patient,
  # PatientAccount, AuthSession, ...) — see packages/db. Separate from the
  # `postgres` service above, which only backs the HAPI FHIR sandbox.
  app-postgres:
    image: postgres:16
    container_name: medical-platform-app-postgres
    environment:
      POSTGRES_DB: medical_platform
      POSTGRES_USER: medical_platform
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in deploy/.env}
    volumes:
      - medical-platform-app-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_platform -d medical_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - medical-platform

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: medical-platform-web
    depends_on:
      app-postgres:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3002}:3001"
    environment:
      NODE_ENV: production
      # Sponsor clinic is the real production target — reads/writes live
      # OSCAR via ClinicCredential (see app-postgres above), not the FHIR
      # sandbox. Set to "fhir" only to temporarily fall back to the sandbox.
      DATA_SOURCE: ${DATA_SOURCE:-oscar}
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      NEXT_PUBLIC_API_URL: /api
      # HTTP deploy (no TLS yet) — set to "true" after enabling HTTPS
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://medical_platform:${APP_DB_PASSWORD}@app-postgres:5432/medical_platform
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in deploy/.env}
      OSCAR_CLINIC_ID: ${OSCAR_CLINIC_ID:-sponsor-clinic}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    networks:
      - medical-platform

volumes:
  medical-platform-hapi-pg:
  medical-platform-app-pg:

networks:
  medical-platform:
    name: medical-platform-network
